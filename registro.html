<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pesca - C.A.T.Ser & Tecnofotos</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-image: url('https://images.unsplash.com/photo-1616340729503-9a79a2ebc8fb?q=80&w=1920');
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed; 
        }

        .app-container { max-width: 650px; margin: 0 auto; padding: 10px; }

        .header-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .logo-badge { font-size: 45px; margin-bottom: 5px; }

        h1 { color: #0066cc; margin: 0; font-size: 24px; text-transform: uppercase; }
        .slogan { font-size: 14px; color: #555; font-weight: bold; margin-top: 5px; }

        .form-card { 
            background: rgba(255, 255, 255, 0.95);
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
        select, input { 
            width: 100%; padding: 12px; box-sizing: border-box; 
            border: 1px solid #ccc; border-radius: 8px; 
            background: #fff; font-size: 16px;
        }
        
        .action-button { 
            background: #e67e22; 
            color: white; border: none; 
            padding: 15px; width: 100%; border-radius: 8px; 
            font-size: 18px; cursor: pointer; font-weight: bold;
            transition: background 0.3s; text-transform: uppercase;
        }
        .action-button:hover { background: #d35400; }

        .history-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .item { 
            background: #eef2f7; 
            padding: 15px; margin-bottom: 15px; 
            border-radius: 8px; border-left: 6px solid #0066cc; 
            display: flex; gap: 15px; align-items: center; 
        }
        .item img { 
            width: 80px; height: 80px; 
            object-fit: cover; border-radius: 6px; 
            border: 2px solid #fff; 
        }
        .item-text { flex-grow: 1; font-size: 14px; }

        footer { 
            text-align: center; margin-top: 30px; font-size: 13px; 
            color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

<div style="margin-bottom: 15px;">
    <a href="index.html" style="text-decoration: none; color: #fff; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);">⬅ Volver al Menú</a>
</div>

<div class="app-container">
    <div class="header-card">
        <div class="logo-badge">🐟 🌊 🎣</div>
        <h1>Registro de Pesca</h1>
        <div class="slogan">Patrocinado por C.A.T.Ser & Tecnofotos</div>
    </div>

    <div class="form-card">
        <div class="form-group">
            <label for="zona">Ambiente:</label>
            <select id="zona">
                <option value="Río">Río</option>
                <option value="Mar">Mar</option>
                <option value="Laguna">Laguna</option>
            </select>
        </div>

        <div class="form-group">
            <label for="lugarPesca">Lugar de Pesca:</label>
            <input type="text" id="lugarPesca" placeholder="Ej: El Remanso, Chascomús, Paraná...">
        </div>

        <div class="form-group">
            <label for="modalidad">Modalidad:</label>
            <select id="modalidad">
                <option value="Costa">Costa</option>
                <option value="Muelle">Muelle</option>
                <option value="Embarcado">Embarcado</option>
            </select>
        </div>

        <div class="form-group">
            <label for="especie">Especie / Pieza:</label>
            <input type="text" id="especie" placeholder="Ej: Dorado, Surubí, Pejerrey...">
        </div>

        <div class="form-group">
            <label for="tamano">Tamaño (cm):</label>
            <input type="number" id="tamano" placeholder="Ej: 75">
        </div>

        <div class="form-group">
            <label for="carnada">Carnada Utilizada:</label>
            <input type="text" id="carnada" placeholder="Ej: Morena, Maíz, Artificial...">
        </div>

        <div class="form-group">
            <label for="destino">Destino de la Captura:</label>
            <select id="destino">
                <option value="Devolución">Devolución</option>
                <option value="Consumo">Consumo</option>
            </select>
        </div>

        <div class="form-group">
            <label for="foto">Foto de la Captura:</label>
            <input type="file" id="foto" accept="image/*">
        </div>

        <button class="action-button" onclick="guardarCaptura()">Registrar Captura</button>
    </div>

    <div class="history-card">
        <h3>Historial de Capturas (Comunidad):</h3>
        <div class="list" id="listaCapturas">Cargando capturas desde la nube...</div>
    </div>

    <footer>
        <p><strong>C.A.T.Ser</strong> &bull; <strong>Tecnofotos</strong> | Todos los derechos reservados © 2026</p>
    </footer>
</div>

<!-- SCRIPTS DE FIREBASE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuración de tu Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyB05r0eiW8DKSIjGMcrf7RnZPnJ107f6c",
        authDomain: "tulugardepesca.firebaseapp.com",
        projectId: "tulugardepesca",
        storageBucket: "tulugardepescaloss.appspot.com",
        messagingSenderId: "473732595896",
        appId: "1:473732595896:web:91e57ac0a93a006e2b44d",
        measurementId: "G-832M0QN524"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Hacer funciones accesibles globalmente para los botones HTML
    window.guardarCaptura = async function() {
        const zona = document.getElementById('zona').value;
        const lugarPesca = document.getElementById('lugarPesca').value;
        const modalidad = document.getElementById('modalidad').value;
        const especie = document.getElementById('especie').value;
        const tamano = document.getElementById('tamano').value;
        const carnada = document.getElementById('carnada').value;
        const destino = document.getElementById('destino').value;
        const fotoInput = document.getElementById('foto');

        if (!especie) {
            alert('Por favor, ingresa la especie.');
            return;
        }

        if (fotoInput.files && fotoInput.files[0]) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                await subirAFirebase(zona, lugarPesca, modalidad, especie, tamano, carnada, destino, e.target.result);
            }
            reader.readAsDataURL(fotoInput.files[0]);
        } else {
            await subirAFirebase(zona, lugarPesca, modalidad, especie, tamano, carnada, destino, '');
        }
    }

    async function subirAFirebase(zona, lugarPesca, modalidad, especie, tamano, carnada, destino, imagenSrc) {
        try {
            await addDoc(collection(db, "capturas"), {
                zona, lugarPesca, modalidad, especie, tamano, carnada, destino, imagenSrc,
                fecha: new Date()
            });
            alert('¡Captura registrada con éxito en la nube!');
            document.getElementById('lugarPesca').value = '';
            document.getElementById('especie').value = '';
            document.getElementById('tamano').value = '';
            document.getElementById('carnada').value = '';
            document.getElementById('foto').value = '';
            cargarHistorial();
        } catch (e) {
            console.error("Error al guardar: ", e);
            alert('Hubo un error al guardar la captura.');
        }
    }

    async function cargarHistorial() {
        const lista = document.getElementById('listaCapturas');
        lista.innerHTML = 'Cargando...';
        
        try {
            const q = query(collection(db, "capturas"));
            const querySnapshot = await getDocs(q);
            
            lista.innerHTML = '';
            if (querySnapshot.empty) {
                lista.innerHTML = '<p style="color: #666; text-align: center;">No hay capturas registradas todavía.</p>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const c = doc.data();
                const nuevoItem = document.createElement('div');
                nuevoItem.className = 'item';
                
                let textoLugar = c.lugarPesca ? `<strong>Lugar:</strong> ${c.lugarPesca} <br>` : '';
                let textoModalidad = c.modalidad ? `<strong>Modalidad:</strong> ${c.modalidad} <br>` : '';
                let textoTamano = c.tamano ? `<strong>Tamaño:</strong> ${c.tamano} cm <br>` : '';
                
                nuevoItem.innerHTML = `
                    ${c.imagenSrc ? `<img src="${c.imagenSrc}" alt="Foto">` : ''}
                    <div class="item-text">
                        <strong>Ambiente:</strong> ${c.zona} <br> 
                        ${textoLugar}
                        ${textoModalidad}
                        <strong>Especie:</strong> ${c.especie} <br> 
                        ${textoTamano}
                        <strong>Carnada:</strong> ${c.carnada} <br> 
                        <strong>Destino:</strong> ${c.destino}
                    </div>`;
                
                lista.appendChild(nuevoItem);
            });
        } catch (e) {
            console.error("Error al cargar historial: ", e);
            lista.innerHTML = '<p style="color: red; text-align: center;">Error al cargar las capturas de la nube.</p>';
        }
    }

    // Cargar al abrir la página
    cargarHistorial();
</script>

</body>
</html>
