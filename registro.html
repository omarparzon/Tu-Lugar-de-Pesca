<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pesca - C.A.T.Ser & Tecnofotos</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-image: url('https://images.unsplash.com/photo-1616340729503-9a79a2ebc8fb?q=80&w=1920');
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed; 
        }

        .app-container { 
            max-width: 650px; 
            margin: 0 auto; 
            padding: 10px; 
        }

        .header-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Estilo para el logotipo insignia */
        .logo-badge {
            font-size: 45px;
            margin-bottom: 5px;
        }

        h1 { 
            color: #0066cc; 
            margin: 0; 
            font-size: 24px; 
            text-transform: uppercase; 
        }
        .slogan { font-size: 14px; color: #555; font-weight: bold; margin-top: 5px; }

        .form-card { 
            background: rgba(255, 255, 255, 0.95);
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
        select, input { 
            width: 100%; padding: 12px; box-sizing: border-box; 
            border: 1px solid #ccc; border-radius: 8px; 
            background: #fff; font-size: 16px;
        }
        
        .action-button { 
            background: #e67e22; 
            color: white; border: none; 
            padding: 15px; width: 100%; border-radius: 8px; 
            font-size: 18px; cursor: pointer; font-weight: bold;
            transition: background 0.3s; text-transform: uppercase;
        }
        .action-button:hover { background: #d35400; }

        .history-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .item { 
            background: #eef2f7; 
            padding: 15px; margin-bottom: 15px; 
            border-radius: 8px; border-left: 6px solid #0066cc; 
            display: flex; gap: 15px; align-items: center; 
        }
        .item img { 
            width: 80px; height: 80px; 
            object-fit: cover; border-radius: 6px; 
            border: 2px solid #fff; 
        }
        .item-text { flex-grow: 1; font-size: 14px; }

        footer { 
            text-align: center; margin-top: 30px; font-size: 13px; 
            color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header-card">
        <div class="logo-badge">🐟 🌊 🎣</div>
        <h1>Registro de Pesca</h1>
        <div class="slogan">Patrocinado por C.A.T.Ser & Tecnofotos</div>
    </div>

    <div class="form-card">
        <div class="form-group">
            <label for="zona">¿Dónde vas a pescar?</label>
            <select id="zona">
                <option value="Río">Río</option>
                <option value="Mar">Mar</option>
            </select>
        </div>

        <div class="form-group">
            <label for="especie">Especie / Pieza:</label>
            <input type="text" id="especie" placeholder="Ej: Dorado, Surubí...">
        </div>

        <div class="form-group">
            <label for="carnada">Carnada Utilizada:</label>
            <input type="text" id="carnada" placeholder="Ej: Morena, Artificial...">
        </div>

        <div class="form-group">
            <label for="destino">Destino de la Captura:</label>
            <select id="destino">
                <option value="Devolución">Devolución</option>
                <option value="Consumo">Consumo</option>
            </select>
        </div>

        <div class="form-group">
            <label for="foto">Foto de la Captura:</label>
            <input type="file" id="foto" accept="image/*">
        </div>

        <button class="action-button" onclick="guardarCaptura()">Registrar Captura</button>
    </div>

    <div class="history-card">
        <h3>Historial de Capturas:</h3>
        <div class="list" id="listaCapturas"></div>
    </div>

    <footer>
        <p><strong>C.A.T.Ser</strong> (Centro de Asistencia Técnica y Servicio) &bull; <strong>Tecnofotos</strong> | Todos los derechos reservados © 2026</p>
    </footer>
</div>

<script>
    function guardarCaptura() {
        const zona = document.getElementById('zona').value;
        const especie = document.getElementById('especie').value;
        const carnada = document.getElementById('carnada').value;
        const destino = document.getElementById('destino').value;
        const fotoInput = document.getElementById('foto');

        if (!especie) {
            alert('Por favor, ingresa la especie.');
            return;
        }

        let imagenSrc = '';
        if (fotoInput.files && fotoInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imagenSrc = e.target.result;
                agregarAlHistorial(zona, especie, carnada, destino, imagenSrc);
            }
            reader.readAsDataURL(fotoInput.files[0]);
        } else {
            agregarAlHistorial(zona, especie, carnada, destino, '');
        }
    }

    function agregarAlHistorial(zona, especie, carnada, destino, imagenSrc) {
        const lista = document.getElementById('listaCapturas');
        const nuevoItem = document.createElement('div');
        nuevoItem.className = 'item';
        
        let contenidoHtml = '';
        if (imagenSrc) {
            contenidoHtml += `<img src="${imagenSrc}" alt="Foto de pesca">`;
        }
        contenidoHtml += `<div class="item-text"><strong>Zona:</strong> ${zona} <br> <strong>Especie:</strong> ${especie} <br> <strong>Carnada:</strong> ${carnada} <br> <strong>Destino:</strong> ${destino}</div>`;

        nuevoItem.innerHTML = contenidoHtml;
        lista.prepend(nuevoItem);

        document.getElementById('especie').value = '';
        document.getElementById('carnada').value = '';
        document.getElementById('foto').value = '';
    }
</script>

</body>
</html>
