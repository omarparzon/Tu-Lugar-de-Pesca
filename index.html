<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Río y Mar - Menú Principal</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            background-color: #f8f9fa; 
            color: #333; 
            padding: 20px;
        }
        
        /* Header minimalista con el Logo */
        .header { 
            background: #fff; 
            padding: 20px; 
            text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            border-radius: 15px;
            max-width: 500px;
            margin: 0 auto 20px auto;
        }
        
        .app-logo {
            width: 140px;
            height: auto;
            border-radius: 50%;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .logo-title { font-size: 22px; font-weight: bold; color: #0066cc; text-transform: uppercase; margin: 0; }
        .logo-subtitle { font-size: 13px; color: #666; font-weight: bold; margin-top: 5px; }
        
        /* Contenedor del Menú */
        .menu-container { padding: 0; display: grid; gap: 15px; max-width: 500px; margin: 0 auto; }
        
        /* Botones de acción */
        .btn { 
            background: #fff; border: 1px solid #eee; padding: 20px; 
            border-radius: 12px; display: flex; align-items: center; 
            text-decoration: none; color: #333; font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: 0.3s;
        }
        .btn:hover { background: #f0f7ff; border-color: #0066cc; }
        .icon { font-size: 24px; margin-right: 15px; }
        
        /* Banner de marcas */
        .brand-footer { text-align: center; margin-top: 30px; font-size: 12px; color: #666; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <!-- AQUÍ SE LLAMA A TU LOGO GUARDADO EN LA CARPETA -->
    <img src="logo.jpg" alt="Logo Río y Mar" class="app-logo">
    <div class="logo-title">Tu lugar de pesca</div>
    <div class="logo-subtitle">Un lugar de pesca</div>
</div>

<div class="menu-container">
    <a href="clima.html" class="btn">
        <span class="icon">🌤️</span> Clima y Pronóstico
    </a>
    
    <a href="registro.html" class="btn">
        <span class="icon">📝</span> Registrar Captura
    </a>
    
    <a href="#" class="btn" onclick="alert('Sección en desarrollo')">
        <span class="icon">🎣</span> El Pique al Día
    </a>
    
    <a href="#" class="btn" onclick="alert('Sección en desarrollo')">
        <span class="icon">📅</span> Próximos Eventos
    </a>
</div>

<div class="brand-footer">
    Patrocinado por C.A.T.Ser & Tecnofotos
</div>

</body>
</html>
