<!-- NUEVO: BUSCADOR / LUPA CON CÁMARA PARA IDENTIFICAR ESPECIE -->
    <div class="widget-card">
        <h3>🔍 Identificar Especie por Foto</h3>
        <p style="font-size: 14px; color: #555; margin-top: 0;">Sacale una foto a tu captura con la lupa para identificarla y registrarla:</p>
        
        <input type="file" id="camaraCaptura" accept="image/*" capture="environment" style="display: none;" onchange="procesarFotoIdentificacion(event)">
        
        <button onclick="document.getElementById('camaraCaptura').click()" style="background: #0066cc; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <span>🔍</span> Abrir Cámara / Lupa
        </button>

        <div id="vistaPreviaIdentificacion" style="margin-top: 15px; text-align: center; display: none;">
            <img id="imagenIdentificada" src="" alt="Foto de la captura" style="max-width: 100%; height: 150px; object-fit: cover; border-radius: 8px; border: 2px solid #ccc; margin-bottom: 10px;">
            <p id="textoResultadoIdentificacion" style="font-size: 14px; font-weight: bold; color: #166534;"></p>
            <a href="registro.html" style="display: inline-block; background: #27ae60; color: white; padding: 10px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px;">Ir a Registrar esta Captura 📸</a>
        </div>
    </div>
