<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Lugar de Pesca - Menú Principal</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; text-align: center; }
        .card { background: white; padding: 20px; margin: 10px auto; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; }
        select { width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; }
        a { text-decoration: none; color: #0066cc; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>🐟 Tu Lugar de Pesca</h1>
    <p>La comunidad de pescadores deportivos</p>
    <a href="registro.html">📸 Registrar Captura</a> | 
    <a href="clima.html">🌤️ Ver Clima</a>
</div>

<div class="card">
    <h3>🎣 ¿Qué vas a pescar?</h3>
    <label for="especie">Seleccioná la especie objetivo:</label>
    <select id="especie">
        <!-- RÍO Y LAGUNA -->
        <optgroup label="Agua Dulce (Río/Laguna)">
            <option value="Dorado">Dorado</option>
            <option value="Surubí">Surubí</option>
            <option value="Pejerrey">Pejerrey</option>
            <option value="Tararira">Tararira (Tarucha)</option>
            <option value="Boga">Boga</option>
            <option value="Pacú">Pacú</option>
            <option value="Patí">Patí</option>
            <option value="Bagre">Bagre</option>
        </optgroup>
        <!-- MAR -->
        <optgroup label="Mar Argentino">
            <option value="Corvina Rubia">Corvina Rubia</option>
            <option value="Corvina Negra">Corvina Negra</option>
            <option value="Lenguado">Lenguado</option>
            <option value="Pez Limón">Pez Limón</option>
            <option value="Salmón de Mar">Salmón de Mar</option>
            <option value="Brótola">Brótola</option>
            <option value="Cazón">Cazón</option>
            <option value="Anchoa de Banco">Anchoa de Banco</option>
        </optgroup>
    </select>
</div>

</body>
</html>
